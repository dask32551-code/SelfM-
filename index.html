<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SelfM — Your Money, Your Control</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mu:#667389;--pr:#2f6fd0;--soft:#e6eefb;--gr:#1f9d55;--rd:#d93a3a;--bd:#edf1f7;--sh:0 2px 10px rgba(20,40,80,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--tx:#e8eefb;--mu:#8fa0ba;--pr:#5b8cff;--soft:#1a2745;--gr:#34d399;--rd:#f87171;--bd:#22304a;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--tx:#e8eefb;--mu:#8fa0ba;--pr:#5b8cff;--soft:#1a2745;--gr:#34d399;--rd:#f87171;--bd:#22304a;--sh:none;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 Inter,"Segoe UI",system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#app{max-width:760px;margin:0 auto;padding:18px 16px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:16px;margin:22px 0 10px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.g{color:var(--gr)}.r{color:var(--rd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.big{font-size:32px;font-weight:700;letter-spacing:-.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.pill{display:inline-block;background:color-mix(in srgb,var(--gr) 14%,transparent);color:var(--gr);border-radius:8px;padding:1px 9px;font-size:12px;margin-top:4px}
.logo{width:34px;height:34px;display:block}.logo svg{width:34px;height:34px}
.dash>div{min-width:0}@media (min-width:900px){#app{max-width:1000px}.dash{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;align-items:start}}
.qa svg,nav svg,.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.qa button{background:0;border:0;color:var(--tx);font:inherit;font-size:11.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;padding:0}
.qa span{width:48px;height:48px;border-radius:50%;background:var(--soft);color:var(--pr);display:grid;place-items:center}
.ic{width:40px;height:40px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.tx{padding:10px 0;border-bottom:1px solid var(--bd)}.tx:last-child{border:0}.tx>div:nth-child(2){flex:1;min-width:0}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr);border-radius:9px;transition:width .5s}
.bar.w i{background:#f59e0b}.bar.o i{background:var(--rd)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav button{flex:1;max-width:150px;background:0;border:0;color:var(--mu);padding:10px 0 9px;font:inherit;font-size:11.5px;cursor:pointer}
nav button{padding:8px 0 8px}nav button span{display:grid;place-items:center;margin:0 auto 3px;width:54px;height:30px;border-radius:15px;transition:background .25s,color .25s}nav button.on span{background:var(--soft)}nav button.on svg{stroke-width:2.1}nav button.on{color:var(--pr);font-weight:700}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;font:inherit;margin-top:4px}
label{display:block;font-size:12.5px;color:var(--mu);margin-top:10px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.s{background:var(--soft);color:var(--pr)}.btn:disabled{opacity:.5}
.seg{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:12px}.seg button{flex:1;border:0;background:0;color:var(--pr);padding:8px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}.seg .on{background:var(--card)}
.mo{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:f .2s}
.mo>div{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:u .25s}
@keyframes f{from{opacity:0}}@keyframes u{from{transform:translateY(30px)}}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:50;display:none;white-space:nowrap}
.err{color:var(--rd);font-size:13px;margin-top:8px;min-height:18px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px}.leg b{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.ov{overflow-x:auto}.empty{text-align:center;color:var(--mu);padding:26px 0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.li{padding:13px 0;border-bottom:1px solid var(--bd);cursor:pointer}.li:last-child{border:0}.li .c svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}.chip.on{background:var(--soft);color:var(--pr);border-color:var(--pr)}
.sel{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;font:inherit;margin-top:4px;cursor:pointer;text-align:left;transition:border-color .2s}.sel:active{border-color:var(--pr)}
.sel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sel svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--mu);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mo>.sheet{padding:8px 8px calc(14px + env(safe-area-inset-bottom,0px));max-height:72%;display:flex;flex-direction:column;overflow:hidden}
.grab{width:40px;height:4px;border-radius:4px;background:var(--bd);margin:4px auto 8px;flex:none}.sheet .list{overflow:auto;overscroll-behavior:contain}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:0;border:0;color:var(--tx);font:inherit;font-size:16px;padding:14px;border-radius:12px;cursor:pointer;text-align:left}.opt:active{background:var(--bg)}.opt.on{background:var(--soft);color:var(--pr);font-weight:600}
.opt svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
input[type=file]{padding:8px;font-size:13px;color:var(--mu)}input[type=file]::file-selector-button{background:var(--soft);color:var(--pr);border:0;border-radius:9px;padding:8px 14px;margin-right:10px;font:inherit;font-weight:600;cursor:pointer}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.btn svg,.mu svg,.err svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row>span.g svg,.row>span.r svg{width:18px;height:18px}
.err svg{display:inline-block;vertical-align:-3px;margin-right:4px}
.pn{display:flex;align-items:flex-start;gap:12px;padding:14px;margin:0 2px 8px;border-radius:14px;background:var(--soft);color:var(--mu);font-size:13px;line-height:1.45}
.hb{width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);color:var(--pr);cursor:pointer;display:grid;place-items:center;padding:0}
.hb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ck button{padding:14px 0;font-size:19px;border-radius:14px}
.pn i{flex:none;width:32px;height:32px;border-radius:10px;background:var(--card);color:var(--pr);display:grid;place-items:center}
.pn i svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn.s:has(>svg){display:inline-grid;place-items:center}
.stp{background:var(--bg);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.stp input,.stp textarea{background:var(--card)}
.sh{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin-bottom:10px}
.sh i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--pr);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.rf{display:flex;align-items:center;gap:12px;margin:0;padding:10px 12px;border:1px dashed var(--pr);border-radius:12px;background:var(--card);color:var(--tx);font-size:14px;cursor:pointer}
.rf span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer;font-size:14.5px}
.oc:last-child{margin:0}
.oc .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--mu);flex:none;transition:all .15s}
.oc.on{border-color:var(--pr);background:var(--soft)}
.oc.on .dot{border-color:var(--pr);background:radial-gradient(var(--pr) 45%,transparent 50%)}
.oc.w.on{border-color:var(--rd);background:color-mix(in srgb,var(--rd) 10%,transparent)}
.oc.w.on .dot{border-color:var(--rd);background:radial-gradient(var(--rd) 45%,transparent 50%)}
[data-x] *{pointer-events:none}
.mo>.sheet2{display:flex;flex-direction:column;overflow:hidden;max-height:92%}
.sbody{overflow:auto;flex:1;min-height:0;overscroll-behavior:contain;margin:0 -6px;padding:0 6px}
.sfoot{flex:none;padding-top:12px;border-top:1px solid var(--bd);margin-top:6px}
.sfoot .err{margin:0 0 8px;min-height:0}
.rf.ok{border-style:solid;border-color:var(--gr);background:color-mix(in srgb,var(--gr) 9%,var(--card))}
.eye{position:absolute;right:6px;top:calc(50% + 2px);transform:translateY(-50%);width:38px;height:38px;border:0;background:0;color:var(--mu);display:grid;place-items:center;cursor:pointer;padding:0}
.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.opt.add{color:var(--pr);font-weight:600;margin-top:6px;border-top:1px solid var(--bd);border-radius:0 0 12px 12px}
/* tap & motion */
button,.li,.chip,.opt,.oc,.rf,.sel,.eye{-webkit-tap-highlight-color:transparent;transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .2s,border-color .2s,box-shadow .2s,opacity .2s,color .2s}
.btn,.chip,.li,.opt,.oc,.rf,.hb,.qa button span,nav button span{position:relative;overflow:hidden}
.btn:active,.chip:active,.hb:active,.sel:active{transform:scale(.95)}
.li:active,.opt:active,.oc:active,.rf:active{transform:scale(.985);background:var(--soft)}
.opt.on:active,.oc.on:active{background:var(--soft)}
.qa button span{transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .2s}
.qa button:active span{transform:scale(.88)}
nav button span{transition:background .25s,color .25s,transform .16s cubic-bezier(.2,.8,.2,1)}
nav button:active span{transform:scale(.88)}
.seg button{transition:background-color .2s,color .2s,transform .16s}.seg button:active{transform:scale(.96)}
.pg{animation:pg .3s cubic-bezier(.2,.8,.2,1)}
@keyframes pg{from{opacity:0;transform:translateY(10px)}}
.mo{animation:f .22s ease-out}
.mo>div{animation:u .34s cubic-bezier(.2,.9,.25,1)}
@keyframes u{from{transform:translateY(60px);opacity:.5}}
#toast{animation:tz .26s cubic-bezier(.2,.9,.25,1)}
@keyframes tz{from{opacity:0;transform:translate(-50%,12px)}}
i.rpl{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);animation:rp .55s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.logo{width:38px;height:38px;display:block;flex:none}.logo img{width:100%;height:100%;display:block;border-radius:11px;box-shadow:0 1px 5px rgba(20,40,80,.18)}
</style>
</head>

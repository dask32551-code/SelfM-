name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files and icons
        run: |
          mkdir -p www/vendor assets
          cp index.html www/index.html
          cp icon-only.png icon-foreground.png icon-background.png assets/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/assets
          npm install jsqr || true
          npm install qrcodejs || true
          cp node_modules/jsqr/dist/jsQR.js www/vendor/jsQR.min.js || true
          cp node_modules/qrcodejs/qrcode.min.js www/vendor/qrcode.min.js || true

      - name: Create Android project
        run: |
          echo '{"appId":"com.selfm.app","appName":"SelfM","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SelfM-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

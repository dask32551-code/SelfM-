name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files and icons
        run: |
          mkdir -p www/vendor assets
          cp index.html www/index.html
          cp icon-only.png icon-foreground.png icon-background.png assets/

      - name: Use fixed signing key (new builds update over old ones)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/assets
          npm install jsqr || true
          npm install qrcodejs || true
          cp node_modules/jsqr/dist/jsQR.js www/vendor/jsQR.min.js || true
          cp node_modules/qrcodejs/qrcode.min.js www/vendor/qrcode.min.js || true

      - name: Create Android project
        run: |
          echo '{"appId":"com.selfm.app","appName":"SelfM","webDir":"www","server":{"androidScheme":"https"}}' > capacitor.config.json
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Add fingerprint plugin
        run: |
          D=android/app/src/main/java/com/selfm/app
          mkdir -p $D
          cat > $D/SelfMBiometricPlugin.java <<'EOF_PLUGIN'
          package com.selfm.app;

          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import androidx.fragment.app.FragmentActivity;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "SelfMBiometric")
          public class SelfMBiometricPlugin extends Plugin {

              @PluginMethod
              public void isAvailable(PluginCall call) {
                  int r = BiometricManager.from(getContext())
                      .canAuthenticate(BiometricManager.Authenticators.BIOMETRIC_WEAK);
                  JSObject o = new JSObject();
                  o.put("available", r == BiometricManager.BIOMETRIC_SUCCESS);
                  call.resolve(o);
              }

              @PluginMethod
              public void authenticate(final PluginCall call) {
                  final String title = call.getString("title", "Unlock SelfM");
                  final String subtitle = call.getString("subtitle", "");
                  final String cancel = call.getString("cancel", "Cancel");
                  getActivity().runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                                  .setTitle(title)
                                  .setSubtitle(subtitle)
                                  .setNegativeButtonText(cancel)
                                  .setAllowedAuthenticators(BiometricManager.Authenticators.BIOMETRIC_WEAK)
                                  .build();
                              BiometricPrompt prompt = new BiometricPrompt(
                                  (FragmentActivity) getActivity(),
                                  ContextCompat.getMainExecutor(getContext()),
                                  new BiometricPrompt.AuthenticationCallback() {
                                      @Override
                                      public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                                          JSObject o = new JSObject();
                                          o.put("ok", true);
                                          call.resolve(o);
                                      }

                                      @Override
                                      public void onAuthenticationError(int code, CharSequence msg) {
                                          call.reject(String.valueOf(msg), String.valueOf(code));
                                      }
                                  });
                              prompt.authenticate(info);
                          } catch (Exception e) {
                              call.reject(String.valueOf(e.getMessage()));
                          }
                      }
                  });
              }
          }
          EOF_PLUGIN
          cat > $D/MainActivity.java <<'EOF_MAIN'
          package com.selfm.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SelfMBiometricPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF_MAIN
          cat >> android/app/build.gradle <<'EOF_GRADLE'

          dependencies {
              implementation "androidx.biometric:biometric:1.1.0"
          }
          EOF_GRADLE

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SelfM-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
